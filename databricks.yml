bundle:
  name: she_watch_genie_ops_zero

include:
  - zeroops-labs.yml

sync:
  include:
    - "*.ipynb"

variables:
  catalog:
    description: Writable Unity Catalog catalog for the labs.
  schema:
    description: Existing disposable schema named zeroops_lab_<alias>.
  warehouse_id:
    description: Serverless or Pro SQL warehouse for the SQL notebooks.

targets:
  dev:
    default: true
    mode: development
    workspace:
      root_path: /Workspace/Users/${workspace.current_user.userName}/.bundle/${bundle.name}/${bundle.target}
